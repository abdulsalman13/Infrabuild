name: Terraform Deploy by Branch

on:
  push:
    branches:
      - main
      - dev

jobs:
  terraform:
    runs-on: [Infra]

    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Set Terraform vars file
        shell: bash
        run: |
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_REF_NAME=$GITHUB_REF_NAME"

          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            echo "TFVARS=main.tfvars" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF_NAME" == "dev" ]]; then
            echo "TFVARS=dev.tfvars" >> "$GITHUB_ENV"
          else
            echo "Unsupported branch"
            exit 1
          fi

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -var-file="$TFVARS"

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file="$TFVARS"
