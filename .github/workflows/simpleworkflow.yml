name: Hello Infra Runner

on:
  push:
     branches: [ main ]

jobs:
   hello:
       runs-on: [ infra ]
       steps:
        - name: Checkout Code
          uses: actions/checkout@v4
        - name: Running the Terraform command
          run: terraform init

        - name: running terraform plan 
          run: terraform plan

        - name: running terraform apply
          run: terraform apply --auto-approve
