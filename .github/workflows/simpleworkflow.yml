name: Hello Infra Runner

on:
  push:
    branches:
      - main
      - dev

jobs:
  hello:
    runs-on: [infra]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Say Hello
        run: echo "Hello I am running this job on self hosted runner"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.CLIENT_ID }}",
              "clientSecret": "${{ secrets.CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.TENANT_ID }}"
            }

      - name: Print Branch And Run Terraform
        shell: bash
        run: |
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_REF_NAME=$GITHUB_REF_NAME"

          if [[ "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_REF" == "refs/heads/dev" ]]; then
            echo "Running terraform for branch $GITHUB_REF_NAME"
            terraform --version
            terraform init
            terraform plan -var-file="${GITHUB_REF_NAME}.tfvars"
            terraform apply -var-file="${GITHUB_REF_NAME}.tfvars" --auto-approve
          else
            echo "This workflow is allowed only for main or dev branch"
            exit 1
          fi
