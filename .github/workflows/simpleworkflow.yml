name: Hello Infra Runner

on:
  push:
    branches: [main]

jobs:
  hello:
    runs-on: [infra]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login (Service Principal)
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.CLIENT_ID }}",
              "clientSecret": "${{ secrets.CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.TENANT_ID }}"
            }
     
      
      - name: Print Terraform Version
        run: |
                if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
                      echo "Running terraform for branch $GITHUB_REF_NAME"
                      terraform init
                      terraform plan 
                      terrafrom apply -f $GITHUB_REF_NAME.tfvars --auto-approve
                elif [[ "$GITHUB_REF" == "refs/heads/dev" ]]; then
                    echo "Running terraform for branch $GITHUB_REF_NAME"
                    terraform init
                    terraform plan 
                    terraform apply -f $GITHUB_REF_NAME.tfvars
                else
                  echo "I am allowed to run the flow in dev or main branch"
                fi
